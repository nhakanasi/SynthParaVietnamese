# Default pipeline configuration. Mirrors notebook45ee5319ae.ipynb cell 6 verbatim —
# see docs/PIPELINE.md for what each field does and why its default is what it is.

seed: 0 # null -> different random pick every run

seedvc:
  repo_dir: third_party/seed-vc # git clone https://github.com/Plachtaa/seed-vc.git target
  diffusion_steps: 50 # 30-50 = best quality
  length_adjust: 1.0 # keep the event's original timing
  cfg_rate: 0.7 # inference-cfg-rate
  f0_condition: false # RMVPE pitch tracking is built for sung/spoken pitch and produces
  # garbage on coughs/sniffs/throat-clearing; only flip to true for laughter

splice:
  placement: gap # legacy fallback if alignment (qwen3/MMS) AND the proportional fallback
  # both come back empty: "gap" (longest pause) | "before" | "after"
  para_gain_db: -3.0 # level of the vocalisation vs. speech peak
  pad_ms: 10 # "fixed" mode only: silence either side of the insert, always applied
  fade_ms: 50 # fade length at the splice junctions
  # Which splice implementation joins the event to the speech (para_synth/audio_utils.py):
  #   tempo    — exponential fades at both junctions + a room-tone gap sized to this
  #              speaker's own median pause. Default: the forced-aligned cut lands
  #              mid-phonation in practice (20/20 rows of the first real batch), which
  #              "fixed" leaves as a hard discontinuity since it never fades the speech.
  #   adaptive — fade/widen a junction only where its boundary RMS says the cut landed on
  #              active phonation.
  #   fixed    — the notebook's original: fixed fade on the insert + fixed pad, regardless.
  mode: tempo
  min_pad_ms: 10 # adaptive only: bridge width at a boundary that was already quiet
  max_gap_ms: 70 # adaptive only: bridge width at a boundary that needed damping
  gap_scale: 1.0 # tempo only: multiplier on the measured median pause (1.0 = exact tempo)
  fade_k: 5.0 # tempo only: exponential fade curvature — higher damps faster
  # tempo only. The gap is a BUDGET, not an addition: audio_utils.existing_silence_s()
  # measures the silence each side of the cut already has, and only the shortfall is
  # inserted. This matters most on the slot-constrained path, where slots.Slot.time_s is by
  # construction the midpoint of a VAD pause — so each side already carries pause_s/2 +
  # vad.edge_margin_s, and a purely additive gap put the event inside up to ~0.9s of dead
  # air where the speaker left 0.15s. Clamped at zero: silence already in the recording is
  # the speaker's own audio and is never shortened.
  #
  # The pre/post multipliers on the speaker's median pause come from vocalsound.GAP_SHAPE,
  # which is asymmetric per class because the respiratory state an event ENDS in is not the
  # one it starts in — a laugh ends on depleted lungs and needs a trailing beat plus an
  # intake before speech resumes; a sniff ends ready to phonate. Uncomment to override:
  # gap_shape:
  #   laughter: [0.6, 1.4]
  #   sniff: [0.5, 0.7]
  #
  # How the event's level is referenced to the speech (audio_utils.level_insert):
  #   context_rms — event RMS against the RMS of the selection.context_s seconds of speech
  #                 before the cut, plus vocalsound.LEVEL_OFFSET_DB for the class. Default.
  #                 Local and RMS-to-RMS because a single plosive anywhere in a 20s take set
  #                 the event's level under "peak", and because selection already matches
  #                 clip intensity against this same local window — the two stages were
  #                 referenced to different things.
  #   peak        — the original: event peak para_gain_db below the utterance's peak.
  level_ref: context_rms
  # The gain that goes with level_ref: context_rms — dB against the speaker's local speech
  # RMS. Separate from para_gain_db above (dB under the utterance's PEAK, used by level_ref:
  # peak and by the fixed/adaptive modes) because they are not the same quantity, and one
  # field meaning either depending on a neighbour is a trap. 0.0 = the event sits at the
  # speaker's local speech RMS, with the per-class offsets moving it from there.
  context_gain_db: 0.0
  # Overrides vocalsound.LEVEL_OFFSET_DB per class, in dB against local speech RMS. A laugh
  # genuinely sits above conversational level and a sniff below; one target is wrong for
  # both in opposite directions. Uncomment to override:
  # level_offsets_db:
  #   laughter: 3.0
  #   sniff: -5.0

selection:
  # How pick_vocalsound_clip() (para_synth/selection.py) chooses a clip within the matched
  # VocalSound class. It matches only on the axes Seed-VC does NOT normalise away — speaker
  # identity/timbre is excluded on purpose, since conversion already handles that with the
  # CAM++ style vector. Each axis distance is scaled so ~1.0 is a clearly audible mismatch;
  # they're summed with these weights into a sampling weight exp(-distance). Soft bias,
  # never a filter: every usable clip keeps nonzero probability, so a loud laugh from a
  # soft-spoken speaker still happens sometimes (real people do that) and the dataset keeps
  # the acoustic variance a Para-TTS model benefits from. All at 0.0 = pure random.
  energy_weight: 1.0 # intensity: crest+duration rank vs. the speaker's own energy rank
  clarity_weight: 1.5 # channel: SNR (dB) + effective bandwidth (octaves). Weighted highest
  # because VocalSound's crowdsourced mics vary far more than its speakers' energy does,
  # and hiss/band-limiting in the source is reconstructed faithfully by Seed-VC — it is the
  # mismatch a clean recording rejects most audibly.
  tempo_weight: 1.0 # timing: envelope rate (octaves). LAUGHTER ONLY — cough/sneeze/
  # throat-clearing/sniff are reflexes whose rate has no link to speaking rate, so this is
  # ignored for them whatever it's set to. Note this selects a clip that already fits; it
  # does not time-stretch one that doesn't (see "Deliberately not implemented").
  tilt_weight: 0.0 # trend: dB the event's loudness rises/falls across its own span, vs the
  # same measure on the speech running into the splice. Independent of tempo_weight (rate =
  # how often the envelope peaks, tilt = which way it's going), and it is the selection-side
  # answer to "let the event decay into the trailing pause" — pick a clip that already
  # decays rather than DSP-shaping one that doesn't.
  # OFF BY DEFAULT AND DELIBERATELY SO: selection.TILT_TOLERANCE_DB is a prior, not a
  # measurement from this corpus, unlike the SNR and tempo tolerances. Run
  # scripts/measure_selection_axes.py, read the tilt_db p10/p90 for both corpora, set the
  # tolerance from it, then raise this to ~0.5-1.0. Turning it on before that spends weight
  # on an axis whose distance scale is guessed.
  context_s: 2.5 # seconds of speech before the splice point used as the energy/pace reference
  candidate_pool: 48 # clips loaded and measured per row when any weight is on. IGNORED when
  # feature_manifest is set — the candidate set is then the whole class.
  max_clipping: 0.01 # hard gate (not a match): drop candidates this clipped
  # Spread of the per-row intensity TARGET, in percentile-rank units. 0.0 aims every row at
  # the speaker's own energy rank, which structurally assumes a person's laugh scales with
  # how loudly they were speaking — a quiet, slow speaker with a loud laugh is a real and
  # common person that a point target can only produce through the sampling weight's tail.
  # Above zero the target is drawn per row around the speaker's rank, so the correlation
  # survives on average while genuine mismatches happen at a rate that was chosen rather
  # than fell out of a weight. NOT the same as lowering energy_weight, which just makes the
  # axis sloppy in both directions instead of aiming it somewhere honest.
  # 0.2 keeps most rows within a fifth of the speaker's rank; raise it for a corpus you
  # want deliberately more varied.
  intensity_spread: 0.2
  # Precomputed per-clip features (scripts/build_clip_features.py). With it, the candidate
  # set is the whole class instead of candidate_pool random decodes, only the winning clip
  # is decoded, and the intensity ranks are corpus-wide instead of draw-wide (ranked inside
  # 48 resampled clips, the same clip scores differently on different rows and the extremes
  # saturate). It is a cache, not a commitment: raw measurements only, so re-weighting or
  # re-scaling any axis needs no rebuild — only changing an extractor does, and
  # selection.FEATURE_VERSION turns a stale manifest into a warning + fallback, never a
  # silently wrong run. null = measure a sampled pool per row, as before.
  feature_manifest: null # e.g. data/vocalsound/clip_features.json

sample_rate: 22050 # Seed-VC's base vocoder rate; everything is resampled to this

alignment:
  # Stage order tried by para_synth.align.find_insert_time(), first success wins:
  #   1. qwen3       — Qwen3-ForcedAligner-0.6B: no pronunciation dictionary needed, so it
  #                    doesn't hit the dictionary-OOV ("spn") problem cell 22 of the
  #                    notebook was debugging for Vietnamese colloquial fillers/particles.
  #                    Preferred, and it resolves every row in practice.
  #   2. mms         — torchaudio MMS_FA (cell 8's original fallback), acoustic backstop
  #   3. proportional — word-fraction estimate snapped to nearest silence (last resort)
  # Montreal Forced Aligner was removed: it needed a conda/Kaldi env nothing else here uses,
  # and its vietnamese_mfa dictionary marks the particles this pipeline splices around as
  # OOV. See "Alignment stage order" in docs/PIPELINE.md.
  use_qwen3: true

vad:
  # Pause detection. Used by two different things, which is worth keeping straight:
  #   - `para-synth slots` uses min_pause_s / merge_gap_s / edge_margin_s / backend to
  #     enumerate the positions the LLM may choose from. This is the primary path.
  #   - `align` uses max_shift_s / on_no_pause to nudge an ALREADY-PLACED tag toward a pause,
  #     for rows whose tag this pipeline didn't place (a pre-tagged JSONL manifest). Those
  #     two settings do nothing on the slots path — there is nothing to snap, the position
  #     was chosen from pauses to begin with.
  #
  # Forced alignment answers "between which two words does the [tag] go" — but a word
  # boundary in connected speech is usually continuous phonation, not a pause, so the
  # aligned time lands mid-voice routinely: worst-junction activity on the first real
  # 20-row batch spanned 0.04-1.76, MEDIAN 0.85 (see quality.max_boundary_activity, which
  # rejects such rows after the fact). This moves the cut onto a real pause instead, so
  # those rows become usable rather than filtered out.
  enabled: true
  # silero — a trained speech/non-speech classifier; robust where an energy threshold
  #          misfires, which is exactly the between-utterance gap where breaths live (a
  #          breath is "not silent" to RMS but "not speech" to a VAD). Weights ship inside
  #          the pip package, so it stays offline. Install: pip install -e '.[vad]'
  # energy  — split_nonsilent()'s frame-RMS threshold, already used elsewhere here. No
  #          extra dependency, and the automatic fallback if silero-vad isn't installed.
  backend: silero
  min_pause_s: 0.12 # ignore gaps shorter than this — a stop closure is not a pause
  # How far the cut may move to reach a pause. This is a SEMANTIC bound, not an acoustic
  # one: the aligner put the tag between two specific words, and moving the event far from
  # there inserts it between *different* words than the transcript claims. That is why the
  # answer to "no pause nearby" is to reject the row rather than search further out.
  # MEASURED on the first real 20-row batch: distance from the aligned tag position to the
  # nearest pause was median 2.02s (min 0.28, max 13.65), and 3 of 20 recordings had no
  # qualifying pause at all — these are ~15-20s of near-continuous Vietnamese speech with
  # only 0-7 pauses each. So a shift budget big enough to reach a pause on most rows
  # (~2-3s) is far past the point where the event lands between the words the transcript
  # says it does. 0.5s keeps the move to roughly one word's width.
  #   max_shift_s: 0.3 -> 1/17 rows snap | 0.5 -> 1/17 | 1.0 -> 4/17 | 2.0 -> 7/17
  max_shift_s: 0.5
  merge_gap_s: 0.10 # join speech regions closer than this before looking for pauses;
  # without it, every glottal break and stop closure reads as its own "pause"
  edge_margin_s: 0.05 # trim each pause's edges, where the neighbouring words' energy is
  # already rising. NOTE the `energy` backend already smears speech ~one analysis frame
  # (128ms) into adjacent silence, so it under-measures pause width by about that much on
  # top of this margin — expect it to find far fewer pauses than `silero` on the same audio.
  # What to do when no qualifying pause is within max_shift_s:
  #   keep — splice at the unsnapped aligned time (default). Given the measurement above,
  #          `skip` would have dropped 19 of 20 rows on the reference batch, so keeping is
  #          the only setting with usable yield on a corpus like this. Rows that stay
  #          mid-utterance are still judged by quality.max_boundary_activity in `filter`,
  #          so this loses nothing that was previously caught — VAD snapping is a strict
  #          improvement where a pause exists and a no-op where one doesn't.
  #   skip — drop the row instead. Use when a mid-utterance splice is unacceptable and
  #          yield doesn't matter; check the `no_pause` count in the align summary first.
  on_no_pause: keep

models:
  # third_party/models/ is laid out by pipeline purpose, not by vendor — see
  # third_party/models/README.md. Local snapshot dirs fall back to downloading from the
  # Hugging Face Hub id at run time if the local dir doesn't exist (see
  # scripts/download_qwen3_models.sh for the offline-fetch step).
  qwen3_asr_dir: third_party/models/asr/qwen3-asr-0.6b
  qwen3_asr_hub_id: Qwen/Qwen3-ASR-0.6B
  qwen3_forced_aligner_dir: third_party/models/aligner/qwen3-forcedaligner-0.6b
  qwen3_forced_aligner_hub_id: Qwen/Qwen3-ForcedAligner-0.6B
  # Seed-VC (conversion) manages its own checkpoint download inside its own repo — see
  # third_party/models/conversion/README.md — so there's no separate path to configure here.
  # Speaker-similarity/speaker-ID (para_synth/quality.py, third_party/models/speaker-id/)
  # currently downloads microsoft/wavlm-base-plus-sv on demand; offline pre-fetch is not
  # wired up yet.
  speaker_id_dir: third_party/models/speaker-id/wavlm-base-plus-sv
  speaker_id_hub_id: microsoft/wavlm-base-plus-sv

quality:
  # Which speaker encoder scores each conversion (para_synth/quality.py):
  #   campplus — the same CAM++ encoder Seed-VC v1's inference.py builds its style vector
  #              from, so sim_converted measures the conversion in the embedding space it
  #              was actually conditioned on. Needs seedvc.repo_dir to exist.
  #   wavlm    — microsoft/wavlm-base-plus-sv, an independent verifier. Needs no seed-vc
  #              checkout, but judges the clone from outside the space it was optimised
  #              for, so a faithful conversion can still score modestly.
  speaker_embedder: campplus

  # Splice-junction check, applied by the `filter` stage and needing no model at all.
  # NISQA below scores the *finished* recording, where tempo_splice has already fade-damped
  # both junctions and separated them with a room-tone gap — so an event that interrupts the
  # speaker mid-vowel still reads as a clean signal. This measures the source recording at
  # the insertion time instead: the ratio of the energy right at the cut to the surrounding
  # speech's own level (0 = the cut fell in silence, ~1 = it fell on speech as loud as the
  # segment average). It is the only check here that judges *where* the event went rather
  # than how the audio came out. A row is judged on the louder of its two junctions.
  # Forced alignment lands mid-phonation routinely — measured worst-junction activity on
  # the first 20-row batch spans 0.04 to 1.76, median 0.85 — so this is a threshold that has
  # to be picked by ear against a real distribution, not derived. 1.2 is where that batch
  # was judged to stop being acceptable; it rejects 3 rows of 20, where 1.0 would reject 7
  # and 0.8 would reject 11. Re-listen before reusing it on a different corpus.
  # null = not checked. Note adaptive_splice's own 0.2 "active" threshold is a different
  # decision entirely: that is where a junction is worth damping, far below where a row is
  # worth rejecting.
  max_boundary_activity: 1.2

  nisqa:
    # NISQA v2.0 (para_synth/nisqa.py) predicts what a listening panel would score each
    # finished Para recording, with no reference signal — the check speaker_embedder can't
    # make, since a cosine between speaker embeddings says nothing about hiss, a step at a
    # splice junction, or conversion coloration.
    #
    # LICENCE: torchmetrics downloads the upstream NISQA weights, which are CC BY-NC-SA 4.0
    # — NON-COMMERCIAL. Fine for research and internal dataset triage; do not ship them in
    # a product. `enabled: false` means they are never downloaded.
    enabled: true
    # Each dimension carries two optional criteria (null = not checked): an absolute floor
    # on the finished recording, and a cap on how far it fell below the source recording it
    # was built from. A row passes when every criterion that is set passes. Failing rows are
    # listed and left out of metadata_filtered.jsonl — nothing is deleted, and everything
    # measured is cached in data/work/stages/quality.jsonl, so re-tuning any threshold below
    # costs no model time at all. `loudness` has no threshold: the pipeline peak-normalises
    # its output, so a loudness difference measures that, not the splice.
    #
    # The drops are the load-bearing criteria. An absolute floor mostly measures how clean
    # the input corpus was; the drop measures what this pipeline did to it, which is the
    # question worth asking and the one that survives a uniformly noisy or uniformly clean
    # corpus. Same relative-measure reasoning as the selection axes above. Measured spread
    # on the first 20-row batch: see docs/PIPELINE.md ("NISQA filtering").
    min_mos: null # overall quality, 1-5
    max_mos_drop: 0.5 # measured drops spanned -0.11..+0.59; this rejects the one outlier,
    # and the gap between that outlier and the next value is wide enough that anything from
    # 0.40 to 0.55 filters identically.
    min_noisiness: null # hiss/background noise — a mismatched VocalSound microphone
    max_noisiness_drop: null
    min_discontinuity: null # isolated interruptions — the dimension a bad splice moves
    max_discontinuity_drop: 0.22 # measured drops spanned -0.28..+0.43, median +0.11. Set
    # well inside the distribution rather than at its outlier: this is the dimension that
    # scores a seam at the splice specifically, so it is the one worth being strict on, and
    # 0.22 is where the batch was judged by ear to stop being acceptable. Re-listen before
    # reusing it on a different corpus.
    min_coloration: null # timbral distortion — Seed-VC's own footprint
    max_coloration_drop: null

paths:
  # Where rows come from. Two mutually exclusive sources:
  #   manifest — a JSONL file, one {"audio_filepath": ..., "text": ...} object per line,
  #              audio paths relative to the manifest's own directory. This is the format a
  #              corpus normally arrives in, its `text` usually already carries the [tag],
  #              and `para-synth export` writes the finished rows back out in the same
  #              shape (extra columns like lang/dataset_name carried through untouched).
  #   the raw_/tagged_ directories below — audio paired with a transcript of the same
  #              filename stem, for a corpus assembled by hand. Used when manifest is null.
  # manifest: data/raw/sample_clean/metadata.jsonl
  manifest: null
  raw_audio_dir: data/raw/audio
  raw_transcript_dir: data/raw/transcripts
  tagged_transcript_dir: data/tagged/transcripts
  vocalsound_dir: data/vocalsound/audio_16k
  work_dir: data/work # scratch: source/converted VocalSound clips, Seed-VC output, etc.
  stage_dir: data/work/stages # per-stage resume artifacts: align.jsonl, quality.jsonl
  output_dir: data/output/default_run

asr:
  # Used by `para-synth transcribe` for audio-only input (diagram: raw speech recording
  # with no pre-existing transcript) — fills data/raw/transcripts/ via Qwen3-ASR before the
  # rest of the pipeline runs. Not used when a transcript already exists for a clip.
  language: Vietnamese # null -> auto-detect

tagging:
  # Offer the model only the positions where VAD found a real pause (para_synth/slots.py),
  # and have it answer with a slot number rather than a rewritten transcript.
  #
  # This is the ordering SynParaSpeech (arXiv:2509.14946) uses, and it exists because the
  # alternative does not work: with free placement the tag lands at a word boundary, which
  # in connected speech is continuous phonation, and moving the cut afterwards is bounded by
  # meaning rather than acoustics — 19 of 20 rows on the reference batch had no pause within
  # reach (see the vad: block). Choosing from pauses in the first place makes the position a
  # pause by construction, and the tagged text is then written locally from the same choice,
  # so text position and splice time are one decision instead of two that must agree.
  #
  # Requires `para-synth slots` to have run, and always uses the audio backend regardless of
  # `backend` below: hearing the recording is what separates a breath worth filling from a
  # hesitation. Rows with no qualifying pause are skipped rather than spliced mid-utterance.
  # false — the older free-placement path: no VAD, no aligner, no audio model needed, but
  #         `quality.max_boundary_activity` then spends its time rejecting what it produces.
  slot_constrained: true
  # Used when slot_constrained is false:
  # "qwen" / "gemini"    — send the transcript text only (cheap, the default).
  # "qwen_omni_audio"    — also send the recording, so the model picks a tag and a position
  #                        that suit the actual delivery (a sigh after a slow breathy
  #                        phrase, placed where the speaker pauses) instead of inferring
  #                        from text alone. Costs more per row and caps audio at 150s.
  backend: qwen
  qwen_model: qwen-plus
  gemini_model: gemini-2.5-flash
  qwen_omni_audio_model: qwen3-omni-flash
